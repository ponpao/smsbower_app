<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.5" stop-color="#7a2048"/>
      <stop offset="1" stop-color="#d64336"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- equalizer bars -->
  <g filter="url(#glow)">
    <rect x="108" y="300" width="26" height="70"  rx="13" fill="url(#wave)"/>
    <rect x="150" y="250" width="26" height="120" rx="13" fill="url(#wave)"/>
    <rect x="192" y="200" width="26" height="170" rx="13" fill="url(#wave)"/>
    <rect x="322" y="230" width="26" height="140" rx="13" fill="url(#wave)"/>
    <rect x="364" y="270" width="26" height="100" rx="13" fill="url(#wave)"/>
    <rect x="406" y="310" width="26" height="60"  rx="13" fill="url(#wave)"/>
  </g>

  <!-- key = license, with a play triangle as the key head -->
  <g filter="url(#glow)">
    <circle cx="256" cy="180" r="70" fill="none" stroke="#ffffff" stroke-width="26"/>
    <path d="M238 152 l44 28 -44 28 z" fill="#ffffff"/>
    <rect x="242" y="238" width="28" height="150" rx="14" fill="#ffffff"/>
    <rect x="270" y="300" width="46" height="26" rx="13" fill="#ffffff"/>
    <rect x="270" y="344" width="34" height="26" rx="13" fill="#ffffff"/>
  </g>

  <!-- sparkle -->
  <circle cx="150" cy="150" r="6" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="380" cy="150" r="5" fill="#22d3ee" fill-opacity="0.9"/>
</svg>
